<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 雛形。blog/posts/YYYY-MM-DD-<名前>.html に写し、{{…}} を全部埋める。手順は blog/README.md -->
<title>{{題}} | Blog | Project Design</title>
<meta name="description" content="{{概要}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{題}}">
<meta property="og:description" content="{{概要}}">
<!-- サムネイル（カードと og:image の一枚・1200×630 の .png か .jpg）は、どちらかの道で作る。手順は blog/README.md の「サムネイル」
     ① pjdhiro が画像を渡す：bash scripts/blog-thumb.sh <渡された画像> <記事の名前>
     ② Claude が描く：blog/_thumbs-src/<記事の名前>.svg に描いて bash scripts/blog-thumb.sh blog/_thumbs-src/<記事の名前>.svg <記事の名前>
     この記事は {{①か②}} の道 -->
<meta property="og:image" content="https://uminomae.github.io/project-design-theory/blog/assets/thumbs/{{サムネイルのファイル名（.png か .jpg）}}">
<meta name="twitter:card" content="summary_large_image">
<!-- 一覧のカードは、ここまでの題（og:title）・概要（description）・サムネイル（og:image）と、下の日付・タグから scripts/blog-index.py が作る -->
<meta property="article:published_time" content="{{YYYY-MM-DD}}">
<meta property="article:tag" content="{{タグ}}">
<link rel="icon" href="../../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;500&display=swap">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/base.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/theme.js"></script>
<script src="../design-system/menu.js" defer></script>
<script src="../design-system/dialog.js" defer></script>
</head>
<body>
<header class="bl-header">
  <div class="bl-header__inner">
    <a class="bl-header__name" href="../">Blog</a>
    <nav class="bl-header__nav" aria-label="サイト">
      <button type="button" class="bl-menu-toggle" data-bl-menu-toggle aria-expanded="false" aria-controls="bl-menu">Menu</button>
      <button type="button" class="bl-theme-toggle" data-bl-theme-toggle>暗く</button>
    </nav>
    <!-- 行き先はサイトの Menu と同じ（design-system/menu.js が描く）。JS が動かないときは HOME だけ -->
    <nav class="bl-menu" id="bl-menu" aria-label="サイトの Menu" hidden><a href="../../">HOME</a></nav>
  </div>
</header>

<main class="bl-main">
  <article class="bl-post">
    <header class="bl-post__head">
      <h1 class="bl-post__title">{{題}}</h1>
      <div class="bl-post__meta">
        <time datetime="{{YYYY-MM-DD}}">{{YYYY-MM-DD}}</time>
        <ul class="bl-tags" aria-label="タグ">
          <li><a class="bl-tag" href="../?tag={{タグ}}">#{{タグ}}</a></li>
        </ul>
      </div>
      <!-- 解説を窓で出すとき（要らなければ、この div と下の dialog を消す）。SNS の投稿を元にした記事でも、ボタンと窓の帯は「この記事の解説」と書く -->
      <div class="bl-post__actions">
        <button type="button" class="bl-open-dialog" data-bl-open="kaisetsu">この記事の解説</button>
      </div>
    </header>

    <div class="bl-post__body">
      <p>{{本文}}</p>
    </div>

    <!-- 関連するページ（要らなければ、この section を消す）。SNS の投稿の末尾のリンクは本文に残さず、ここへ移す。
         __note はどういう関わりのリンクか（投稿の末尾の添え書きがあれば、その言葉）、__desc は行き先のページの題・副題・冒頭の言葉から取る -->
    <section class="bl-related" aria-labelledby="related-title">
      <h2 class="bl-related__title" id="related-title">関連するページ</h2>
      <ul class="bl-related__list">
        <li class="bl-related__item">
          <p class="bl-related__note">{{どういう関わりのリンクか}}</p>
          <a class="bl-related__link" href="{{行き先（このサイトのページは ../../reader/… の相対パス）}}">{{行き先の題}}</a>
          <p class="bl-related__desc">{{何のページかを一行}}</p>
        </li>
      </ul>
    </section>
  </article>
</main>

<dialog class="bl-dialog" id="kaisetsu" aria-labelledby="kaisetsu-title">
  <div class="bl-dialog__bar">
    <span id="kaisetsu-title">この記事の解説</span>
    <button type="button" class="bl-dialog__close" data-bl-close>閉じる</button>
  </div>
  <div class="bl-dialog__body">
    <p>{{解説}}</p>
  </div>
</dialog>

<footer class="bl-footer">
  <div class="bl-footer__inner">
    <a href="../">記事の一覧</a>
    <a href="../../">Project Design</a>
  </div>
</footer>
</body>
</html>
