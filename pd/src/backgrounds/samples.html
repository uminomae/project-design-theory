<!DOCTYPE html>
<!--
  Love駆動開発の背景の見本を並べる（noindex・どこからもリンクしない確かめ用のページ）。
  本文とガラスは重ねず、背景だけを見せる（pjdhiro 2026-11-10「ガラスがあって見づらいので、サンプルにテキスト入れないで」）。
  どの見本を読むかは reader-app.js の loveBackgroundModule。選んだものを
  reader-love-driven-dev-template.html の body に data-background="love-<名前>" として入れる。
-->
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Love駆動開発の背景の見本</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #05070d; color: #dfe3ee; font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7; }
        main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
        h1 { font-weight: 400; font-size: 1.2rem; margin: 0 0 20px; }
        section { margin: 0 0 36px; }
        h2 { font-weight: 500; font-size: 1rem; margin: 0 0 8px; }
        h2 a { color: #c9b98f; font-weight: 400; font-size: 0.85rem; margin-left: 0.8em; }
        .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; overflow: hidden; background: #000; }
        .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        @media (max-width: 640px) { .frame { aspect-ratio: 3 / 4; } }
    </style>
</head>
<body>
<main>
    <h1>Love駆動開発の背景の見本（背景だけ）</h1>

    <section>
        <h2>Gemini 1　二つの源のベクトル場と、クライン／トーラス型の面 <a href="frame.html?bg=gemini">全画面</a></h2>
        <div class="frame"><iframe src="frame.html?bg=gemini" title="Gemini 1" loading="lazy"></iframe></div>
    </section>

    <section>
        <h2>Gemini 2　蔵本モデルの同期と、トーラスの網目 <a href="frame.html?bg=gemini2">全画面</a></h2>
        <div class="frame"><iframe src="frame.html?bg=gemini2" title="Gemini 2" loading="lazy"></iframe></div>
    </section>

    <section>
        <h2>Gemini 3　複素ポテンシャルの渦と、中央の液体のような面 <a href="frame.html?bg=gemini3">全画面</a></h2>
        <div class="frame"><iframe src="frame.html?bg=gemini3" title="Gemini 3" loading="lazy"></iframe></div>
    </section>
</main>
</body>
</html>
