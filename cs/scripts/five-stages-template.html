<!DOCTYPE html>
<!--
  このファイルはテンプレート。生成物 reader/five-stages.html・reader/five-stages-en.html を直接編集しない。
  正本:   knowledge/schema/five-stages.md（英語は knowledge/schema/five-stages.en.md）
  再生成: python3 scripts/build-five-stages.py
  デザイン: cs の VI（src/styles/tokens.css の変数と cosmic ambient）。reader-th-template.html と同じ面と見出し。WebGL は使わない
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<link rel="canonical" href="https://uminomae.github.io/project-design-theory/cs/reader/{{CANONICAL}}">
<link rel="alternate" hreflang="ja" href="https://uminomae.github.io/project-design-theory/cs/reader/five-stages.html">
<link rel="alternate" hreflang="en" href="https://uminomae.github.io/project-design-theory/cs/reader/five-stages-en.html">
<meta name="description" content="{{DESCRIPTION}}">

<script>
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-X5WQCB3JYT';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X5WQCB3JYT');
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/styles/tokens.css">

<style>
  :root{
    --bg:var(--ds-color-bg-body);
    --panel:var(--cs-surface-2);
    --ink:rgb(var(--ds-color-highlight));
    --muted:rgb(var(--ds-color-sub-text));
    --faint:rgba(var(--ds-color-sub-text),.55);
    --line:rgba(var(--ds-color-accent),.14);
    --accent:rgb(var(--ds-color-accent));
    --link:rgb(var(--ds-color-link));
    --radius:var(--ds-radius-lg);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
    font-family:var(--cs-font-sans-ui);
    line-height:1.85;padding:26px 16px 70px;
    background:
      radial-gradient(1100px 760px at 18% -8%, rgba(var(--ds-color-accent),.10), transparent 60%),
      radial-gradient(1000px 720px at 100% 4%, rgba(var(--ds-color-accent),.07), transparent 55%),
      var(--bg);
    background-attachment:fixed;}
  .wrap{max-width:860px;margin:0 auto;
    background:var(--cs-surface-2);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:28px clamp(16px,4vw,36px) 40px;}

  .reader-hero h1{font-family:var(--ds-font-serif-display);font-size:clamp(1.4rem,4vw,2rem);
    margin:0 0 10px;font-weight:500;letter-spacing:var(--ds-letter-ui-tight);color:rgb(var(--ds-color-heading));}
  .reader-meta{font-size:12.5px;color:var(--faint);margin:0 0 14px;}
  .reader-meta a{color:var(--link);text-decoration:none;}
  .reader-meta a:hover{text-decoration:underline;}
  .reader-lead{color:var(--muted);font-size:15px;margin:0 0 .8em;}

  .reader-article{margin-top:24px;font-size:15.5px;}
  .reader-article p{margin:0 0 1.1em;}
  .reader-heading{font-family:var(--ds-font-serif-display);font-weight:500;
    color:rgb(var(--ds-color-heading));letter-spacing:var(--ds-letter-ui-tight);
    border-bottom:1px solid var(--line);padding-bottom:.3em;scroll-margin-top:16px;}
  h2.reader-heading{font-size:1.35rem;margin:2.2em 0 .8em;}
  h3.reader-heading{font-size:1.1rem;margin:1.8em 0 .5em;border-bottom:none;}
  .reader-article a{color:var(--link);}
  .reader-article strong{color:var(--cs-md-strong);}
  .reader-article ul{padding-left:1.3em;margin:0 0 1.2em;}
  .reader-article li{margin:.35em 0;}

  .stage-definition{font-family:var(--ds-font-serif-display);font-size:1.08em;
    border-left:3px solid rgba(var(--ds-color-accent),.45);padding:.2em 0 .2em .9em;}
  .layer-intro{color:var(--muted);font-size:.95em;}
  .count-note{color:var(--faint);font-size:.88em;}

  .reader-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
  .reader-table{padding:6px 14px;margin:0 0 1.3em;overflow-x:auto;}
  .reader-table table{border-collapse:collapse;width:100%;font-size:.9em;}
  .reader-table th{color:var(--cs-md-table-head-text);background:var(--cs-md-table-head-bg);
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .reader-table td{color:var(--cs-md-table-cell-text);padding:8px 10px;
    border-bottom:1px solid var(--line);vertical-align:top;}
  .table-wide td:not(:nth-child(4)){word-break:keep-all;}
  .table-wide td:nth-child(4){min-width:14em;}
  .reader-table td:first-child{white-space:nowrap;}
  .reader-table tr:last-child td{border-bottom:none;}
  /* 狭い幅では表を行ごとに積む（表の中を横に送らない） */
  @media (max-width:760px){
    .tablefit{padding:4px 12px;}
    .tablefit thead{display:none;}
    .tablefit table,.tablefit tbody,.tablefit tr,.tablefit td{display:block;width:100%;}
    .tablefit tr{padding:8px 0;border-bottom:1px solid var(--line);}
    .tablefit tr:last-child{border-bottom:none;}
    .tablefit td,.table-wide td:nth-child(4){border-bottom:none;padding:2px 0;min-width:0;}
    .tablefit td::before{content:attr(data-label);display:block;font-size:.8em;color:var(--faint);}
  }

  .reader-toc{padding:14px 20px;margin:1.4em 0;}
  .reader-toc-title{font-weight:700;font-size:.92em;color:var(--muted);
    letter-spacing:var(--ds-letter-ui-wide);margin:0 0 6px;}
  .reader-toc ol{margin:0;padding-left:1.3em;font-size:.94em;}
  .reader-toc li{margin:.25em 0;}
  .reader-toc a{color:var(--link);text-decoration:none;}
  .reader-toc a:hover{text-decoration:underline;}

  footer{margin-top:44px;font-size:12px;color:var(--faint);
    border-top:1px solid var(--line);padding-top:14px;}
  footer a{color:var(--link);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header class="reader-hero">
    <h1>{{TITLE}}</h1>
    <p class="reader-meta">
      {{UPDATED_LABEL}}: {{UPDATED}} ／ {{OTHER_LANG}} ・ {{HOME}} ・
      <a href="https://github.com/uminomae/project-design-theory/blob/main/cs/knowledge/schema/five-stages.md">{{SOURCE_LABEL}}</a>
    </p>
    {{LEAD}}
  </header>

  {{TOC}}

  <article class="reader-article">
{{BODY}}
  </article>

  <footer>
    {{FOOTER}}
  </footer>
</div>
</body>
</html>
