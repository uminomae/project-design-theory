<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* creation-space design-system aligned palette (cosmic blue).
     Local var names are kept; only values are remapped onto design-system
     tokens so the page matches the main site (shared with dashboard.html). */
  :root{
    --bg:var(--ds-color-bg-body);
    --panel:var(--cs-surface-2); --panel2:var(--cs-surface-3);
    --ink:rgb(var(--ds-color-highlight)); --muted:rgb(var(--ds-color-sub-text));
    --faint:rgba(var(--ds-color-sub-text),.55); --line:rgba(var(--ds-color-accent),.14);
    --gold:rgb(var(--ds-color-accent)); --teal:rgb(var(--ds-color-link));
    --green:#5cc2a3; --red:var(--ds-error-color); --amber:#e0ad4e;
    --radius:var(--ds-radius-lg);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);
    font-family:var(--cs-font-sans-ui);line-height:1.6;padding:26px 18px 70px;
    /* cosmic ambient (DESIGN.md §1): faint indigo spreading over deep dark. */
    background:
      radial-gradient(1100px 760px at 18% -8%, rgba(var(--ds-color-accent),.10), transparent 60%),
      radial-gradient(1000px 720px at 100% 4%, rgba(var(--ds-color-accent),.07), transparent 55%),
      var(--bg);
    background-attachment:fixed;}
  .wrap{max-width:920px;margin:0 auto;}
  a{color:var(--teal);} h1{font-family:var(--ds-font-serif-display);font-size:22px;font-weight:500;margin:0 0 4px;letter-spacing:var(--ds-letter-ui-tight);}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px;}
  .back{font-size:13px;}
  .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0 6px;}
  .cc{background:var(--cs-card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .cc .n{font-size:24px;font-weight:700;color:var(--gold);} .cc .l{font-size:12.5px;color:var(--muted);}
  .cc.read .n{color:var(--green);} .cc.link .n{color:var(--teal);} .cc.no .n{color:var(--faint);}
  .gloss{font-size:12.5px;color:var(--faint);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:12px 0;}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 8px;align-items:center;}
  input,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13px;}
  input:focus,select:focus{outline:none;border-color:var(--ds-focus-ring-soft);}
  input{flex:1 1 220px;}
  h2{font-size:16px;margin:22px 0 6px;display:flex;gap:8px;align-items:center;color:var(--ink);}
  .grp{border-left:4px solid var(--line);padding-left:12px;}
  .grp.gpdf{border-left-color:var(--green);} .grp.glink{border-left-color:var(--teal);} .grp.gno{border-left-color:var(--faint);}
  .row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline;}
  .row:first-child{border-top:none;}
  .dom{flex:0 0 auto;font-size:11px;color:var(--gold);font-weight:700;width:38px;}
  .ti{flex:1 1 auto;} .ti .src{color:var(--faint);font-size:11.5px;}
  .lk{flex:0 0 auto;font-size:12px;}
  .muted{color:var(--faint);} .hint{color:var(--faint);font-size:12px;margin:4px 0 0;}
  #status{color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="back"><a href="dashboard.html">← ダッシュボードへ戻る</a></p>
  <h1>原典リスト（材料の論文）</h1>
  <p class="sub">調査の材料にしている論文の台帳（manifest）をライブ表示。公開 URL のある原文には、リンクで飛べます。</p>

  <div class="counts" id="counts"></div>
  <div class="gloss" id="gloss">読み込み中…</div>

  <div class="tools">
    <input id="q" placeholder="著者・タイトルで絞り込み" oninput="render()">
    <select id="dom" onchange="render()"><option value="">全分野</option></select>
    <span id="status"></span>
  </div>

  <div id="list"></div>
</div>

<script>
// 今までの repo の中身は、この repo の cs/ に移した（2026-11-07）。原典の PDF（cs/knowledge/raw/）は git に入れず手元だけに置く。
const OWNER="uminomae", REPO="project-design-theory", BRANCH="main", DIR="cs/";
const TREEBASE="https://github.com/"+OWNER+"/"+REPO+"/tree/"+BRANCH+"/"+DIR;
let ROWS=[];

function b64utf8(b64){return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,"")),function(c){return c.charCodeAt(0);}));}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function firstUrl(s){const m=s.match(/https?:\/\/[^\s)|]+/);return m?m[0]:null;}
function cleanTitle(t){return t.replace(/\*\*/g,"").replace(/\*/g,"").replace(/`/g,"").trim();}
function idKey(id){const m=(id||"").match(/D(\d+)-S(\d+)/);return m?[parseInt(m[1],10),parseInt(m[2],10),id]:[1e9,1e9,id];}
function byId(a,b){const ka=idKey(a.id),kb=idKey(b.id);return ka[0]-kb[0]||ka[1]-kb[1]||(ka[2]<kb[2]?-1:ka[2]>kb[2]?1:0);}

function parseManifest(md){
  const rows=[];
  md.split("\n").forEach(function(line){
    if(!/^\|\s*D\d+-S\d+\s*\|/.test(line)) return;
    const c=line.split("|").map(function(x){return x.trim();});
    const id=c[1], dom=c[2], access=(c[3]||"").replace(/`/g,"");
    const title=cleanTitle(c[4]||""), local=(c[5]||"").replace(/`/g,""), notes=c.slice(7).join(" | ");
    let url=null, kind=null;
    if(access==="raw-confirmed"){
      // 原典の PDF は公開していないので、公開 URL があるときだけリンクにする
      url=firstUrl(notes); kind=url?"link":"local";
    } else if(access==="url-verified"){
      url=firstUrl(notes); kind="link";
    }
    rows.push({id:id,dom:dom,access:access,title:title,url:url,kind:kind});
  });
  return rows;
}

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const df=document.getElementById("dom").value;
  const groups=[
    {key:"pdf",cls:"gpdf",ic:"📄",label:"原典を手元に保管（PDF）",test:function(r){return r.access==="raw-confirmed";},
     note:"PDF を手元に保管し、本文を確認済み。PDF は公開していないので、リンクは公開 URL があるときだけ。"},
    {key:"link",cls:"glink",ic:"🔗",label:"リンクで閲覧（Web上）",test:function(r){return r.access==="url-verified";},
     note:"repo には保存せず、公開URLの原文を読んで確認。リンクで原文サイトへ。"},
    {key:"no",cls:"gno",ic:"⛔",label:"未取得（本文を読めていない）",test:function(r){return r.access==="blocked-access"||r.access==="citation-only";},
     note:"blocked=取得を試みたが現状ブロック ／ citation-only=目録のみ。どちらも本文は未読。"},
  ];
  let html="", shown=0;
  groups.forEach(function(g){
    let items=ROWS.filter(g.test).filter(function(r){
      if(df && r.dom!==df) return false;
      if(q && (r.title.toLowerCase().indexOf(q)<0 && r.id.toLowerCase().indexOf(q)<0)) return false;
      return true;
    }).sort(byId);
    shown+=items.length;
    html+='<h2>'+g.ic+' '+g.label+' <span class="muted">('+items.length+')</span></h2>';
    html+='<p class="hint">'+g.note+'</p>';
    html+='<div class="grp '+g.cls+'">';
    if(!items.length) html+='<p class="muted" style="padding:7px 0">該当なし</p>';
    items.forEach(function(r){
      const lk = r.url ? '<a class="lk" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+"原文↗"+'</a>'
                       : '<span class="lk muted">'+(r.access==="citation-only"?"目録のみ":r.access==="raw-confirmed"?"手元に保管":"取得不可")+'</span>';
      html+='<div class="row"><span class="dom">'+esc(r.dom)+'</span><span class="ti">'+esc(r.title)+
            ' <span class="src">'+esc(r.id)+'</span></span>'+lk+'</div>';
    });
    html+='</div>';
  });
  document.getElementById("list").innerHTML=html;
  document.getElementById("status").textContent=shown+" 件表示";
}

function renderCounts(){
  const by={};["raw-confirmed","url-verified","blocked-access","citation-only"].forEach(function(k){by[k]=ROWS.filter(function(r){return r.access===k;}).length;});
  const read=by["raw-confirmed"]+by["url-verified"], no=by["blocked-access"]+by["citation-only"];
  document.getElementById("counts").innerHTML=
    '<div class="cc"><div class="n">'+ROWS.length+'</div><div class="l">登録 合計</div></div>'+
    '<div class="cc read"><div class="n">'+read+'</div><div class="l">本文を読めた</div></div>'+
    '<div class="cc"><div class="n">'+by["raw-confirmed"]+'</div><div class="l">📄 手元に保管(PDF)</div></div>'+
    '<div class="cc link"><div class="n">'+by["url-verified"]+'</div><div class="l">🔗 リンク閲覧</div></div>'+
    '<div class="cc no"><div class="n">'+no+'</div><div class="l">⛔ 未取得</div></div>';
  document.getElementById("gloss").innerHTML=
    '<b>用語:</b> <b style="color:var(--green)">手元に保管(PDF) '+by["raw-confirmed"]+'</b>=PDF を手元（knowledge/raw/・公開していない）に保管し本文確認済。 '+
    '<b style="color:var(--teal)">リンク閲覧 '+by["url-verified"]+'</b>=repoには無く公開URLで閲覧。 '+
    '<b>未取得 '+no+'</b>=取得ブロック '+by["blocked-access"]+' ＋ 目録のみ '+by["citation-only"]+
    '（本文未読）。 精読ノートは <a href="'+TREEBASE+'knowledge/source-notes" target="_blank" rel="noopener">knowledge/source-notes/</a>。';
}

async function load(){
  try{
    const res=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+DIR+"knowledge/raw/manifest.md?ref="+BRANCH,
      {headers:{Accept:"application/vnd.github+json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const j=await res.json();
    const md=b64utf8(j.content);
    ROWS=parseManifest(md);
    const sel=document.getElementById("dom");
    Array.from(new Set(ROWS.map(function(r){return r.dom;}))).sort().forEach(function(d){
      const o=document.createElement("option");o.value=d;o.textContent=d;sel.appendChild(o);});
    renderCounts(); render();
  }catch(e){
    document.getElementById("gloss").textContent="台帳を取得できませんでした（"+e.message+"）。台帳（cs/knowledge/raw/manifest.md）は、原典の PDF と同じ場所にあり、今は公開していません。";
  }
}
load();
</script>
</body>
</html>
