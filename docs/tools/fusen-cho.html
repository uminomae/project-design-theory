<title>付箋帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 付箋帳：書く欄と、付箋ごとの進み具合だけ（2026-11-20 に軽くした。手順は docs/tools/fusen-cho.md） */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --sunken: #e9edf4; --ink: #18202e; --muted: #5b6579; --line: #d9dfe9;
  --accent: #2c5bd0; --accent-soft: #e3eafb; --wait: #a35f00; --wait-soft: #fbefd9;
  --done: #2c7a4b; --done-soft: #ddf1e4; --claude: #6a4fc4; --claude-soft: #ece7fb; --danger: #b4372f;
  --font-body: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090e; --surface: #10141c; --sunken: #171c27; --ink: #e2e8f3; --muted: #8f9ab0; --line: #252c3a;
    --accent: #7ea2ff; --accent-soft: #18233f; --wait: #f0b45a; --wait-soft: #33260f;
    --done: #6fcf97; --done-soft: #12291c; --claude: #b29cff; --claude-soft: #231c3d; --danger: #f2877e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07090e; --surface: #10141c; --sunken: #171c27; --ink: #e2e8f3; --muted: #8f9ab0; --line: #252c3a;
  --accent: #7ea2ff; --accent-soft: #18233f; --wait: #f0b45a; --wait-soft: #33260f;
  --done: #6fcf97; --done-soft: #12291c; --claude: #b29cff; --claude-soft: #231c3d; --danger: #f2877e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 64px; margin: 0;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
a { color: var(--accent); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
h1 { font-size: 1.4rem; margin: 0; letter-spacing: 0.06em; }
.conn { font-size: 0.78rem; color: var(--muted); flex: 1 1 auto; }
.conn.bad { color: var(--danger); }
.call-btn { background: var(--claude); color: #fff; border: 0; border-radius: 8px; padding: 7px 16px; font-weight: 700; }
.call-btn:disabled { opacity: 0.45; cursor: default; }
.capture { display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.capture textarea { min-height: 84px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 18px; font-weight: 700; }
.primary:disabled { opacity: 0.45; cursor: default; }
.quiet { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; }
.list { display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); font-size: 0.9rem; padding: 16px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.item.wait { border-color: var(--wait); }
.top { display: flex; gap: 10px; align-items: flex-start; }
.title { flex: 1 1 auto; min-width: 0; text-align: left; background: none; border: 0; padding: 0; font-weight: 500; overflow-wrap: anywhere; }
.title small { color: var(--muted); font-weight: 400; font-size: 0.75rem; margin-left: 8px; }
.title .unread { color: var(--claude); font-weight: 700; }
.st { border: 1px solid transparent; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 700; background: var(--sunken); color: var(--muted); flex: none; white-space: nowrap; }
.st.look, .st.work { background: var(--accent-soft); color: var(--accent); }
.st.decide, .st.check { background: var(--wait-soft); color: var(--wait); }
.st.done { background: var(--done-soft); color: var(--done); }
.st.cur { border-color: currentColor; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.last { margin: 0; font-size: 0.82rem; color: var(--muted); border-left: 3px solid var(--claude); padding-left: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.last b { color: var(--claude); font-weight: 700; margin-right: 6px; }
.body { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.fulltext { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 0.92rem; }
.body textarea { min-height: 60px; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.note { border-left: 3px solid var(--accent); padding-left: 8px; font-size: 0.88rem; }
.note.claude { border-left-color: var(--claude); }
.note b { font-weight: 700; color: var(--accent); margin-right: 6px; font-size: 0.8rem; }
.note.claude b { color: var(--claude); }
.note small { color: var(--muted); font-size: 0.75rem; }
.note p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; max-width: calc(100% - 32px); z-index: 20; }
</style>

<div class="wrap">
  <header>
    <h1>付箋帳</h1>
    <span class="conn" id="conn">つないでいます…</span>
    <button type="button" class="call-btn" id="call-btn" hidden>司令塔を呼ぶ</button>
  </header>

  <form class="capture" id="capture" autocomplete="off">
    <textarea id="cap-text" placeholder="一行目が題になります" aria-label="付箋に書くこと"></textarea>
    <div class="row"><button type="submit" class="primary" id="cap-send">置く</button></div>
  </form>

  <div class="list" id="list"><div class="empty">読み込んでいます…</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const STATUS = [
    { key: "new", label: "届いた" }, { key: "look", label: "見ている" }, { key: "decide", label: "判断を待つ" },
    { key: "work", label: "直している" }, { key: "check", label: "確かめを待つ" }, { key: "done", label: "済んだ" },
  ];
  const SLABEL = Object.fromEntries(STATUS.map(s => [s.key, s.label]));
  const WAITING = new Set(["decide", "check"]);

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const iso = () => new Date().toISOString();
  const fmt = s => { if (!s) return ""; const d = new Date(s); if (isNaN(d)) return ""; const p = n => String(n).padStart(2, "0"); return `${d.getMonth() + 1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const firstLine = t => { const l = (String(t).split(/\r?\n/).find(x => x.trim()) || "").trim(); return l.length > 80 ? l.slice(0, 80) + "…" : l; };
  const safeUrl = u => { try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch { return null; } };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let db = null, comments = null, canSend = "off", loaded = false;
  let items = new Map();
  const open = new Set();
  const drafts = new Map();
  let picking = null;

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  function setConn(msg, bad) { const c = $("conn"); c.textContent = msg; c.classList.toggle("bad", !!bad); }
  function linkify(parent, text) {
    const re = /(https?:\/\/[^\s<>"）」]+)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.append(text.slice(last, m.index));
      const u = safeUrl(m[1]);
      if (u) { const a = el("a", null, m[1]); a.href = u; a.target = "_blank"; a.rel = "noopener"; parent.append(a); } else parent.append(m[1]);
      last = m.index + m[1].length;
    }
    if (last < text.length) parent.append(text.slice(last));
  }

  // Claude がまだ読んでいない：pjdhiro の最後の書き込みが Claude の最後の書き込みより後ろ（並び順と時刻の両方で見る）
  function needsClaude(d) {
    if (d.lastFrom !== "pjdhiro") return false;
    let lp = -1, lc = -1;
    (d.thread || []).forEach((x, i) => { if (x.from === "pjdhiro") lp = i; else if (x.from === "claude") lc = i; });
    if (lp > lc) return true;
    const r = d.claudeReadAt;
    if (!r || r > new Date(Date.now() + 5 * 60000).toISOString()) return true;
    return !!(d.lastAt && d.lastAt > r);
  }
  const lastClaude = d => [...(d.thread || [])].reverse().find(x => x.from === "claude" && x.kind !== "status");

  async function withDb(fn, okMsg) {
    if (!db) { toast("この表示では書けません。claude.ai で開いてください。"); return false; }
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(e && e.code === "quota_exceeded" ? "帳面がいっぱいです。" : "書けませんでした。少し置いてもう一度押してください。"); return false; }
  }

  function renderItem(id, d) {
    const card = el("article", "item" + (WAITING.has(d.status) ? " wait" : ""));
    const top = el("div", "top");
    const t = el("button", "title"); t.type = "button"; t.setAttribute("aria-expanded", String(open.has(id)));
    t.append(d.title || firstLine(d.text || "") || "（題なし）");
    t.append(el("small", null, fmt(d.createdAt)));
    if (needsClaude(d)) t.append(el("small", "unread", "Claude まだ"));
    t.addEventListener("click", () => { if (open.has(id)) open.delete(id); else open.add(id); render(); });
    // 進み具合：押すと六つの段が出て、押した段にする
    const cur = SLABEL[d.status] ? d.status : "new";
    const pill = el("button", "st " + cur, SLABEL[cur]); pill.type = "button";
    pill.setAttribute("aria-label", "進み具合：" + SLABEL[cur]); pill.setAttribute("aria-expanded", String(picking === id));
    pill.addEventListener("click", () => { picking = picking === id ? null : id; render(); });
    top.append(t, pill); card.append(top);
    if (picking === id) {
      const steps = el("div", "steps");
      for (const s of STATUS) {
        const b = el("button", "st " + s.key + (s.key === cur ? " cur" : ""), s.label); b.type = "button";
        b.addEventListener("click", () => { picking = null; render(); setStatus(id, s.key); });
        steps.append(b);
      }
      card.append(steps);
    }

    const lc = lastClaude(d);
    if (lc) { const p = el("p", "last"); p.title = lc.text || ""; p.append(el("b", null, "Claude")); linkify(p, lc.text || ""); card.append(p); }

    if (open.has(id)) {
      const body = el("div", "body");
      body.append(el("p", "fulltext", d.text || ""));
      // 書き足しと返事：thread の行を並び順に出す（進み具合の行は除く）
      const notes = (d.thread || []).filter(x => x && x.kind !== "status" && x.text);
      if (notes.length) {
        const ol = el("ol", "notes");
        for (const x of notes) {
          const li = el("li", x.from === "claude" ? "note claude" : "note");
          li.append(el("b", null, x.from === "claude" ? "Claude" : "書き足し"), el("small", null, fmt(x.at)));
          const p = el("p"); linkify(p, x.text); li.append(p); ol.append(li);
        }
        body.append(ol);
      }
      const ta = el("textarea"); ta.id = "reply-" + id; ta.placeholder = "書き足す"; ta.setAttribute("aria-label", "書き足す");
      ta.value = drafts.get(id) || ""; ta.addEventListener("input", () => drafts.set(id, ta.value));
      const row = el("div", "row");
      const arch = el("button", "quiet", "しまう"); arch.type = "button"; arch.addEventListener("click", () => archiveItem(id));
      const send = el("button", "primary", "書き足す"); send.type = "button"; send.addEventListener("click", () => addNote(id, ta.value));
      row.append(arch, send); body.append(ta, row); card.append(body);
    }
    return card;
  }

  function render() {
    const a = document.activeElement; const aid = a && a.id;
    const list = $("list"); list.textContent = "";
    if (!loaded) { list.append(el("div", "empty", db ? "読み込んでいます…" : "この表示では帳面を読めません。claude.ai で開いてください。")); return; }
    if (!items.size) { list.append(el("div", "empty", "付箋はありません。")); return; }
    const all = [...items.entries()].sort((x, y) => (y[1].createdAt || "").localeCompare(x[1].createdAt || ""));
    for (const [id, d] of all) list.append(renderItem(id, d));
    if (aid) { const again = document.getElementById(aid); if (again) again.focus(); }
  }

  $("capture").addEventListener("submit", async ev => {
    ev.preventDefault();
    const text = $("cap-text").value.trim(); if (!text) { $("cap-text").focus(); return; }
    const now = iso();
    const id = "i" + now.replace(/\D/g, "").slice(0, 14) + Math.random().toString(36).slice(2, 5);
    $("cap-send").disabled = true;
    const ok = await withDb(() => db.collection("items").doc(id).set({
      text, title: firstLine(text), place: "other", where: "", kind: "指示", status: "new",
      thread: [], links: [], commits: [], issue: null, session: "",
      createdAt: now, updatedAt: now, lastFrom: "pjdhiro", lastAt: now, claudeReadAt: null,
    }), "置きました");
    $("cap-send").disabled = false;
    if (ok) { $("cap-text").value = ""; store.set("fusen.draft", ""); }
  });
  $("cap-text").value = store.get("fusen.draft", "");
  $("cap-text").addEventListener("input", () => store.set("fusen.draft", $("cap-text").value));

  async function addNote(id, text) {
    text = (text || "").trim(); if (!text) { toast("書く欄が空です"); return; }
    const ok = await withDb(async () => {
      const ref = db.doc("items/" + id); const snap = await ref.get(); if (!snap.exists) throw { code: "gone" };
      const d = snap.data(); const now = iso();
      const th = [...(d.thread || []), { from: "pjdhiro", kind: "instruction", text, at: now }];
      const up = { thread: th, lastFrom: "pjdhiro", lastAt: now, updatedAt: now };
      // 済んだ付箋に書き足したら、同じ付箋が開き直る
      if (d.status === "done") { th.push({ from: "pjdhiro", kind: "status", text: "済んだ → 届いた（書き足し）", at: now }); up.status = "new"; }
      await ref.update(up);
    }, "書き足しました");
    if (ok) { drafts.delete(id); render(); }
  }

  async function setStatus(id, status) {
    await withDb(async () => {
      const ref = db.doc("items/" + id); const snap = await ref.get(); if (!snap.exists) throw { code: "gone" };
      const d = snap.data(); if (d.status === status) return; const now = iso();
      await ref.update({ status, thread: [...(d.thread || []), { from: "pjdhiro", kind: "status", text: `${SLABEL[d.status] || d.status} → ${SLABEL[status]}`, at: now }], lastFrom: "pjdhiro", lastAt: now, updatedAt: now });
    }, `「${SLABEL[status]}」にしました`);
  }

  async function archiveItem(id) {
    const d = items.get(id); if (!d) return;
    const now = iso(); const links = d.links || [];
    const ok = await withDb(async () => {
      await db.doc("archive/" + id).set({ ...d, closedAt: now, outcome: d.status === "done" ? "済んだ" : "しまった（" + (SLABEL[d.status] || d.status) + "）", linksCleared: links.length === 0 });
      await db.doc("items/" + id).delete();
    }, "しまいました");
    if (ok) open.delete(id);
  }

  // 司令塔を呼ぶ：コメントを「Claude に送る」で出し、帳面を見張っている司令塔のセッションを起こす
  function renderCall() {
    const b = $("call-btn");
    if (!comments || canSend === "off" || canSend === "writers_only") { b.hidden = true; return; }
    b.hidden = false; b.disabled = canSend !== "available";
    b.title = canSend === "available" ? "帳面を見張っている司令塔のセッションに届きます" : "司令塔のセッションが開いていません";
  }
  async function refreshCan() {
    if (!comments) return;
    let c = "off"; try { c = await comments.canSendToClaude(); } catch { c = "off"; }
    if (c !== canSend) { canSend = c; renderCall(); }
  }
  $("call-btn").addEventListener("click", async () => {
    const btn = $("call-btn"); btn.disabled = true;
    const waiting = [...items.values()].filter(needsClaude);
    const lines = ["付箋帳を読んでください（手順は docs/tools/fusen-cho.md）。"];
    lines.push(waiting.length ? `Claude がまだ読んでいないもの ${waiting.length} 件：` : "Claude がまだ読んでいないものはありません。");
    for (const d of waiting.slice(0, 20)) lines.push("・" + (d.title || firstLine(d.text || "")));
    try {
      const anchor = await comments.anchorFor(btn);
      await comments.sendToClaude({ anchor, text: lines.join("\n").slice(0, 3800) });
      toast("司令塔に届けました");
    } catch (e) {
      const c = e && e.code;
      if (c === "consent_required") toast("このページからコメントする許可が要ります。許可してから、もう一度押してください。");
      else if (c === "claude_unavailable") { toast("司令塔に届きませんでした。司令塔のセッションが開いているか確かめてください。"); refreshCan(); }
      else if (c === "rate_limited") toast("続けて呼びすぎています。少し間を置いてください。");
      else toast("呼べませんでした。少し置いてもう一度押してください。");
    }
    btn.disabled = canSend !== "available";
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshCan(); });
  window.addEventListener("focus", () => refreshCan());

  render();
  (async () => {
    try { comments = await window.claude?.use?.("comments"); } catch { comments = null; }
    if (comments) refreshCan();
  })();
  (async () => {
    const timer = setTimeout(() => setConn("帳面にまだつながりません。開き直してください。", true), 10000);
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    if (!db) { clearTimeout(timer); setConn("この表示では帳面を読めません。claude.ai で開いてください。", true); loaded = true; render(); return; }
    db.collection("items").onSnapshot(snap => {
      const m = new Map(); for (const doc of snap.docs) m.set(doc.id, doc.data());
      items = m; loaded = true;
      for (const id of [...open]) if (!items.has(id)) open.delete(id);
      if (!snap.metadata.fromCache) { clearTimeout(timer); setConn(`付箋 ${m.size} 件`); }
      render();
    }, () => { clearTimeout(timer); setConn("帳面を読めなくなりました。開き直してください。", true); });
  })();
})();
</script>
