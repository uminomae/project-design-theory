name: Deploy Pages

# 公開するのはサイトのファイルだけ。規約・docs・読み物の正本・scripts は出さない。
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'sitemap.xml'
      - 'favicon.ico'
      - 'src/**'
      - 'content/**'
      - 'assets/**'
      - 'reader/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html src/ content/ assets/ reader/ _site/
          cp robots.txt llms.txt llms-full.txt sitemap.xml favicon.ico _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
