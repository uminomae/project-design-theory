name: Deploy Pages

# pd/ はサイトのファイルと wiki だけを根に出す。as/・ks/・cs/ は今までのサイトと同じく、ディレクトリごと出す。
on:
  push:
    branches: [main]
    paths:
      - 'pd/**'
      - 'as/**'
      - 'ks/**'
      - 'cs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz dependencies
        working-directory: pd/quartz
        run: npm ci

      - name: Build wiki with Quartz
        working-directory: pd/quartz
        run: npx quartz build --directory ../wiki --output ../wiki-out

      - name: Assemble site
        run: |
          mkdir -p _site
          cd pd
          cp -r index.html src/ content/ assets/ reader/ ../_site/
          cp robots.txt llms.txt llms-full.txt sitemap.xml favicon.ico ../_site/
          cp -r wiki-out/ ../_site/wiki/
          cd ..
          cp -r as ks cs _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
