name: Check

# サイトの検査（scripts/check.sh）を、develop と main に入れるたびに走らせる。
# 今までの repo の ci.yml・test.yml の代わり（docs/harness-pending/README.md）。
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: サイトの検査
        run: bash scripts/check.sh
