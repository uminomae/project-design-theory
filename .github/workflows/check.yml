name: Check

# サイトの検査（scripts/check.sh）を、develop と main に入れるたびに走らせる。
# 今までの repo の ci.yml・test.yml の代わり。何を入れているかは docs/TESTING.md。
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # wiki の古いページを数えるのに、出典の commit の日付が要る（scripts/check.sh）
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: サイトの検査
        run: bash scripts/check.sh

      # 公開してよいかの点検（docs/PUBLISH-CHECK.md）。手元だけの語の一覧は git に無いので、
      # ここで回るのは形の点検だけ（手元のパス・鍵・メール・共有のリンク・書庫の中の名前）。
      # クラウドのセッションの commit や --no-verify で、pre-commit を通らずに入ったものを拾う。
      - name: 公開前の点検（形だけ）
        run: bash scripts/publish-check.sh --all
